<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="48" y1="40" x2="208" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Carbon Squircle -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)" stroke="#262626" stroke-width="4" />

  <!-- Subtle Inner Telemetry Frame -->
  <rect x="28" y="28" width="200" height="200" rx="38" stroke="#1f1f1f" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Corner Telemetry Ticks -->
  <path d="M48 64 V48 H64" stroke="#f87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />
  <path d="M208 64 V48 H192" stroke="#f87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />
  <path d="M48 192 V208 H64" stroke="#f87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />
  <path d="M208 192 V208 H192" stroke="#f87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />

  <!-- Center Geometric P Hardware/Racing Emblem -->
  <g filter="url(#glow)">
    <path
      d="M84 68 H148 C170 68 184 82 184 104 C184 126 170 140 148 140 H110 V188 H84 V68 Z M110 90 V118 H144 C153 118 159 112 159 104 C159 96 153 90 144 90 H110 Z"
      fill="url(#accentGrad)"
    />
  </g>

  <!-- Active Telemetry Status Dot -->
  <circle cx="196" cy="196" r="7" fill="#f87171" />
</svg>
